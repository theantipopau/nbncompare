name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Run linting
      run: pnpm lint

    - name: Run tests
      run: pnpm --filter @clearnbn/web test:run

    - name: Run parser smoke tests
      run: pnpm --filter @clearnbn/shared test:parsers

    - name: Build shared package
      run: pnpm --filter @clearnbn/shared build

    - name: Build web app
      run: pnpm --filter @clearnbn/web build

    - name: Build worker
      run: pnpm --filter @clearnbn/worker build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build shared package
      run: pnpm --filter @clearnbn/shared build

    - name: Build web app
      run: pnpm --filter @clearnbn/web build

    - name: Deploy to Cloudflare Pages
      run: pnpm exec wrangler pages deploy apps/web/dist --project-name=nbncompare-web
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Deploy Worker
      run: pnpm --filter @clearnbn/worker exec wrangler deploy --env production
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}