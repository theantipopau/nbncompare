<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags (counts kept evergreen — catalogue grows; see /api/status for live totals) -->
    <title>NBN Compare - Compare NBN Plans from 50+ Australian Providers</title>
    <meta name="title" content="NBN Compare - Compare NBN Plans from 50+ Australian Providers" />
    <meta name="description" content="Compare NBN internet plans from Telstra, Optus, TPG, Aussie Broadband and 50+ more providers. Find the best NBN plan with our free comparison tool featuring promotional offers, Fixed Wireless plans, and real-time pricing." />
    <meta name="keywords" content="NBN compare, NBN plans, internet plans Australia, broadband comparison, NBN prices, Telstra NBN, Optus NBN, TPG, Aussie Broadband, Fixed Wireless NBN, cheap NBN plans, best NBN deals" />
    <meta name="author" content="NBN Compare" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nbncompare.info/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <meta name="theme-color" content="#3b82f6" />
    <!-- NOTE: Chart.js is NOT loaded globally. PriceHistoryModal injects it on
         demand so regular page views skip the ~200KB download. -->
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="NBN Compare" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nbncompare.info/" />
    <meta property="twitter:title" content="NBN Compare - Compare NBN Plans from 50+ Australian Providers" />
    <meta property="twitter:description" content="Compare NBN internet plans from Australia's top providers. Find the best NBN plan with our free comparison tool." />
    <meta property="twitter:image" content="https://nbncompare.info/og-image.png" />
    
    <!-- Additional SEO -->
    <meta name="geo.region" content="AU" />
    <meta name="geo.placename" content="Australia" />
    <meta name="language" content="English" />
    <meta name="coverage" content="Worldwide" />
    <meta name="rating" content="General" />

    <script type="application/ld+json">

      "@context": "https://schema.org",
