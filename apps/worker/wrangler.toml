name = "nbncompare-worker"
compatibility_date = "2025-12-28"
main = "src/index.ts"
account_id = "c54f3f1bd51c54c0b1040f11c0b5c869"
workers_dev = true
preview_urls = false
assets = { directory = "../web/dist", binding = "ASSETS" }
routes = [
  { pattern = "nbncompare.info/*", zone_name = "nbncompare.info" },
  { pattern = "www.nbncompare.info/*", zone_name = "nbncompare.info" }
]

# NOTE: No [triggers] crons — scraping is orchestrated from GitHub Actions
# (see .github/workflows/scrape.yml) so there are zero background Worker runs.
# NOTE: No [ai] binding (Workers AI removed to stay on free plan).
# NOTE: No [browser] binding (Browser Rendering removed — it caused the
# unexpected bill). All scraping is plain fetch with User-Agent rotation.

[[d1_databases]]
binding = "D1"
database_name = "nbncompare"
database_id = "0bc16814-a9a6-4bde-be9c-311c90724eec"

[[kv_namespaces]]
binding = "CACHE"
id = "718bd42c891f4bf4a15e1e6dd0bf4add"

[env.production]
name = "nbncompare-worker"
routes = [
  { pattern = "nbncompare.info/*", zone_name = "nbncompare.info" },
  { pattern = "www.nbncompare.info/*", zone_name = "nbncompare.info" }
]
# Named environments do NOT inherit top-level bindings — redeclare here.
# (A deploy without these serves the site with no database: HTTP 500.)
[[env.production.d1_databases]]
binding = "D1"
database_name = "nbncompare"
database_id = "0bc16814-a9a6-4bde-be9c-311c90724eec"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "718bd42c891f4bf4a15e1e6dd0bf4add"
